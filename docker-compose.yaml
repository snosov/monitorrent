# monitorrent with a FlareSolverr sidecar.
#
# kinozal answers plain HTTP clients with a Cloudflare challenge on the pages
# monitorrent needs. FlareSolverr passes it with a real browser and hands back
# the clearance; monitorrent reuses it through curl_cffi. Without
# MONITORRENT_FLARESOLVERR_URL set, monitorrent behaves as before.
services:
  monitorrent:
    build: .
    image: monitorrent
    container_name: monitorrent
    restart: unless-stopped
    ports:
      - "6687:6687"
    volumes:
      # the folder holding monitorrent.db on this host. Point it at an existing
      # database with MONITORRENT_DATA_DIR=/path/to/folder (or in a .env file);
      # it must also contain any downloader folder, e.g. /data/torrents
      - ${MONITORRENT_DATA_DIR:-./data}:/data
    command: ["python", "server.py", "--db-path", "/data/monitorrent.db"]
    environment:
      - MONITORRENT_FLARESOLVERR_URL=http://flaresolverr:8191/v1
    depends_on:
      - flaresolverr
      - deluge

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info

  # torrent client. In monitorrent: Settings -> Clients -> Deluge, host
  # "deluge", port 58846, user "localclient" with the password from
  # <deluge config>/auth. Deluge's core.conf needs "allow_remote": true, or it
  # listens on 127.0.0.1 only and monitorrent - another container - is refused.
  # 58846 is not published: monitorrent reaches it over the compose network.
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    restart: unless-stopped
    ports:
      - "8112:8112"        # web UI
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${DELUGE_CONFIG_DIR:-./deluge/config}:/config
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
